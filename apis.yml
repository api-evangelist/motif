aid: motif
name: Motif
description: >-
  Motif is an AEC (architecture, engineering, and construction) software company building an
  intelligent, browser-based workspace for building design. Founded in 2023 by former Autodesk
  leaders Amar Hanspal and Brian Mathews, Motif unifies sheet review, live 3D streaming, AI-assisted
  visual exploration, and real-time collaboration in a single cloud platform that bridges 2D and 3D
  workflows as a step toward making Building Information Modeling (BIM) a practical reality. The
  company has raised $46M led by Redpoint Ventures (seed) and Alphabet's CapitalG (Series A), and was
  named to Forbes' 2025 Next Billion-Dollar Startups list. Motif is a collaboration SaaS product for
  design and construction teams; it publishes product learning docs and a help center but does not yet
  expose a public developer API — a plugin/API surface is part of its stated long-term strategy.
